<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

    color: #e0e6ed;
    line-height: 1.6;
}
.header {
    background: linear-gradient(135deg, #0f1729 0%, #1a1f3a 100%);
    border-bottom: 1px solid rgba(99, 102, 241, 0.2);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}
.nav { display: flex; gap: 8px; }
.nav a {
    color: #94a3b8;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.2s;
    border: 1px solid transparent;
}
.nav a:hover, .nav a.active {
    color: #c084fc;
    background: rgba(99, 102, 241, 0.1);
    border-color: rgba(99, 102, 241, 0.3);
}
.container { padding: 32px 40px; max-width: 1600px; margin: 0 auto; }
.grid { display: grid; gap: 24px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.card {
    background: linear-gradient(135deg, #111827 0%, #0f172a 100%);
    border: 1px solid rgba(99, 102, 241, 0.15);
    border-radius: 12px;
    padding: 28px;
    overflow: visible;
    transition: border-color 0.3s;
}
.card:hover { border-color: rgba(99, 102, 241, 0.4); }
.card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #64748b;
    margin-bottom: 16px;
    font-weight: 600;
}
.metric-value {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.metric-label { font-size: 13px; color: #64748b; margin-top: 4px; }
.chart-container { width: 100%; height: 420px; }
.chart-lg { height: 520px; }
.chart-xl { height: 620px; }
.subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 24px;
}
.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: left; font-size: 13px; }
th { color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; font-size: 11px; border-bottom: 1px solid rgba(99, 102, 241, 0.2); }
td { border-bottom: 1px solid rgba(99, 102, 241, 0.08); color: #c9d1d9; }
tr:hover td { background: rgba(99, 102, 241, 0.05); }
@media (max-width: 1200px) { .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .container { padding: 16px; } }

/* ---------- Mobile / responsive ---------- */
.grid > * { min-width: 0; }
.nav a, .badge { white-space: nowrap; }
@media (max-width: 900px) {
    .header { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px 20px; }
    .nav { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -20px; padding: 0 20px 2px; }
    .nav::-webkit-scrollbar { display: none; }
}
@media (max-width: 768px) {
    .header { padding: 14px 16px; }
    .header h1 { font-size: 18px; }
    .nav { margin: 0 -16px; padding: 0 16px 2px; }
    .nav a { padding: 8px 12px; font-size: 14px; }
    .container { padding: 16px; }
    .grid { gap: 12px; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .container > [style*="margin-bottom"] { margin-bottom: 12px !important; }
    .card { padding: 16px; }
    .card h3 { font-size: 11px; margin-bottom: 10px; }
    .metric-value { font-size: 26px; }
    .metric-label { font-size: 12px; }
    .subtitle { font-size: 13px; margin-bottom: 16px; }
    .chart-container { height: 340px; }
    .chart-lg { height: 440px; }
    .chart-xl { height: 480px; }
    #sankey { height: 560px; }
    #heatmap { height: 520px; }
    th, td { padding: 8px 10px; }
}
@media (max-width: 360px) { .grid-4 { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
    /* Investor table becomes a stacked list: name on top, type + numbers below */
    table thead { display: none; }
    table tr { display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 12px;
               padding: 10px 2px; border-bottom: 1px solid rgba(99, 102, 241, 0.08); }
    table td { border: 0; padding: 0; }
    table td:first-child { grid-column: 1 / -1; margin-bottom: 4px; }
    table td:nth-child(3)::after { content: " deals"; color: #64748b; }
    table td:nth-child(2) { justify-self: start; min-width: 0; }
    table td:nth-child(3), table td:nth-child(4) { white-space: nowrap; }
    table td:nth-child(4) { font-weight: 600; }
}
.net-toggle { display: none; }
@media (max-width: 768px) {
    .net-layout { flex-direction: column; height: auto !important; overflow: visible !important; }
    #sidebar { width: 100% !important; min-width: 0 !important; border-right: 0 !important;
               border-bottom: 1px solid rgba(99,102,241,0.15); padding: 14px 16px !important; overflow: visible !important; }
    #sidebar .net-filters { display: none; }
    #sidebar.open .net-filters { display: block; }
    #sidebar label { padding: 5px 0; font-size: 14px; }
    #searchBox { font-size: 16px !important; padding: 10px 12px !important; }
    #sidebar > div:first-child { margin-bottom: 10px !important; }
    .net-toggle { display: block; width: 100%; padding: 10px 12px; background: rgba(99,102,241,0.12);
                  border: 1px solid rgba(99,102,241,0.3); border-radius: 6px; color: #c084fc;
                  font: 600 14px 'Inter', system-ui, sans-serif; cursor: pointer; }
    #sidebar.open .net-toggle { margin-bottom: 16px; }
    #network { flex: none !important; height: 480px; height: 70svh; min-height: 360px; }
    .net-layout > #detailPanel { margin: 12px 16px 20px !important; }
    #detailConnections { font-size: 12px !important; }
}
</style>

const edgeColorMap = {

    'Partnership': '#f59e0b', 'Joint R&D': '#f59e0b',
    'Acquisition': '#ef4444',
    'Customer': '#38bdf8', 'Supplier': '#38bdf8',
    'Licensing': '#a78bfa', 'Spin-off': '#c084fc'
};
const edgeCategory = {
    'funding': 'funding',
    'Partnership': 'partnership', 'Joint R&D': 'partnership',
    'Acquisition': 'ma', 'Spin-off': 'ma',
    'Customer': 'commercial', 'Supplier': 'commercial',
    'Licensing': 'licensing'
};

function getNodeColor(d) {
    if (d.type === 'investor') return '#f472b6';
    return sectorColors[d.group] || '#64748b';
}

const container = document.getElementById('network');
let width = container.clientWidth;
let height = container.clientHeight;

const svg = d3.select('#network').append('svg')
    .attr('width', width).attr('height', height);

const g = svg.append('g');
const zoomBehavior = d3.zoom().scaleExtent([0.15, 6])
    .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoomBehavior);

// Build adjacency index
const adjacency = new Map();
allNodes.forEach(n => adjacency.set(n.id, new Set()));
allLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    adjacency.get(sid)?.add(tid);
    adjacency.get(tid)?.add(sid);
});

// Degree for sizing
allNodes.forEach(n => { n.degree = adjacency.get(n.id)?.size || 0; });

let nodeScale = 1;
function nodeRadius(d) {
    return (Math.sqrt(d.degree + 1) * 3.5 + 4) * nodeScale;
}

const simulation = d3.forceSimulation(allNodes)
    .force('link', d3.forceLink(allLinks).id(d => d.id).distance(100).strength(0.15))
    .force('charge', d3.forceManyBody().strength(-250).distanceMax(500))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 4).strength(0.7))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03))
    .alphaDecay(0.02)
    .velocityDecay(0.4);

const linkG = g.append('g');
const nodeG = g.append('g');
const labelG = g.append('g');

let linkSel = linkG.selectAll('line').data(allLinks).join('line')
    .attr('stroke', d => edgeColorMap[d.type] || '#6b7280')
    .attr('stroke-opacity', 0.35)
    .attr('stroke-width', d => d.type === 'funding' ? 1 : 2);

let nodeSel = nodeG.selectAll('circle').data(allNodes).join('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', getNodeColor)
    .attr('stroke', 'rgba(255,255,255,0.15)')
    .attr('stroke-width', 1)
    .style('cursor', 'pointer');

let labelSel = labelG.selectAll('text').data(allNodes).join('text')

    .attr('fill', '#94a3b8')
    .attr('text-anchor', 'middle')

// Selection state
let selectedNode = null;

function clearSelection() {
    selectedNode = null;
    nodeSel.attr('opacity', 1).attr('stroke', 'rgba(255,255,255,0.15)').attr('stroke-width', 1);
    linkSel.attr('stroke-opacity', 0.35).attr('stroke-width', d => d.type === 'funding' ? 1 : 2);
    labelSel.text(d => document.getElementById('showLabels').checked || d.degree >= 8 ? d.name : '');
    document.getElementById('detailPanel').style.display = 'none';
}

var selectNode = function (d) {
    selectedNode = d;
    const neighbors = adjacency.get(d.id) || new Set();

    // Dim non-connected
    nodeSel.attr('opacity', n => (n.id === d.id || neighbors.has(n.id)) ? 1 : 0.08)
        .attr('stroke', n => n.id === d.id ? '#fff' : neighbors.has(n.id) ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.05)')
        .attr('stroke-width', n => n.id === d.id ? 3 : neighbors.has(n.id) ? 2 : 0.5);

    linkSel.attr('stroke-opacity', l => (l.source.id === d.id || l.target.id === d.id) ? 0.9 : 0.03)
        .attr('stroke-width', l => (l.source.id === d.id || l.target.id === d.id) ? 3 : 0.5);

    // Show labels for neighbors
    labelSel.text(n => (n.id === d.id || neighbors.has(n.id) || document.getElementById('showLabels').checked) ? n.name : '');

    // Detail panel
    const panel = document.getElementById('detailPanel');
    panel.style.display = 'block';
    document.getElementById('detailName').textContent = d.name;

    let meta = d.type === 'investor'
        ? 'Type: ' + d.group + '<br>Connections: ' + d.degree
        : 'Sector: ' + d.group + (d.status ? '<br>Status: ' + d.status : '') + '<br>Connections: ' + d.degree;
    document.getElementById('detailMeta').innerHTML = meta;

    // List connections
    const connLinks = allLinks.filter(l => l.source.id === d.id || l.target.id === d.id);
    let connHtml = '<div style="font-weight:600; margin-bottom:4px; color:#c9d1d9;">Connections:</div>';
    connLinks.forEach(l => {
        const other = l.source.id === d.id ? l.target : l.source;
        const color = edgeColorMap[l.type] || '#6b7280';
        connHtml += '<div style="margin-bottom:2px;"><span style="color:' + color + ';">[' + l.type + ']</span> ' + other.name + '</div>';
    });
    document.getElementById('detailConnections').innerHTML = connHtml;
};

// Click node to select
nodeSel.on('click', function(event, d) {
    event.stopPropagation();
    selectNode(d);
});

// Click background to deselect
svg.on('click', clearSelection);
document.getElementById('detailClear').addEventListener('click', clearSelection);

// Hover
nodeSel.on('mouseover', function(event, d) {
    if (!selectedNode) {
        d3.select(this).attr('stroke', '#fff').attr('stroke-width', 2);
    }
    let html = '<b>' + d.name + '</b><br>';
    html += d.type === 'investor' ? d.group : d.group;
    if (d.status) html += '<br>Status: ' + d.status;
    html += '<br>Connections: ' + d.degree;
    tooltip.html(html).style('opacity', 1);
    const rect = container.getBoundingClientRect();
    tooltip.style('left', (event.clientX - rect.left + 15) + 'px')
           .style('top', (event.clientY - rect.top - 10) + 'px');
}).on('mousemove', function(event) {
    const rect = container.getBoundingClientRect();
    tooltip.style('left', (event.clientX - rect.left + 15) + 'px')
           .style('top', (event.clientY - rect.top - 10) + 'px');
}).on('mouseout', function() {
    if (!selectedNode) {
        d3.select(this).attr('stroke', 'rgba(255,255,255,0.15)').attr('stroke-width', 1);
    }
    tooltip.style('opacity', 0);
});

// Drag
nodeSel.call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
);

simulation.on('tick', () => {
    linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
    labelSel.attr('x', d => d.x).attr('y', d => d.y - nodeRadius(d) - 4);
});

// ── Filters ──
function applyFilters() {
    const showTypes = new Set([...document.querySelectorAll('.filter-type:checked')].map(c => c.value));
    const showSectors = new Set([...document.querySelectorAll('.filter-sector:checked')].map(c => c.value));
    const showEdges = new Set([...document.querySelectorAll('.filter-edge:checked')].map(c => c.value));
    const search = document.getElementById('searchBox').value.toLowerCase().trim();

    const visibleNodes = new Set();
    allNodes.forEach(n => {
        let visible = showTypes.has(n.type);
        if (n.type === 'company') visible = visible && showSectors.has(n.group);
        if (search && !n.name.toLowerCase().includes(search)) visible = false;
        if (visible) visibleNodes.add(n.id);
    });

    nodeSel.attr('display', d => visibleNodes.has(d.id) ? null : 'none');
    labelSel.attr('display', d => visibleNodes.has(d.id) ? null : 'none');

    linkSel.attr('display', d => {
        const cat = edgeCategory[d.type] || 'funding';
        return visibleNodes.has(d.source.id) && visibleNodes.has(d.target.id) && showEdges.has(cat) ? null : 'none';
    });

    if (selectedNode && !visibleNodes.has(selectedNode.id)) clearSelection();
}

document.querySelectorAll('.filter-type, .filter-sector, .filter-edge').forEach(el =>
    el.addEventListener('change', applyFilters));

document.getElementById('searchBox').addEventListener('input', applyFilters);

// Show all labels toggle
document.getElementById('showLabels').addEventListener('change', function() {
    if (selectedNode) selectNode(selectedNode);
    else labelSel.text(d => this.checked ? d.name : (d.degree >= 8 ? d.name : ''));
});

// Node scale slider
document.getElementById('nodeScale').addEventListener('input', function() {
    nodeScale = parseFloat(this.value);
    nodeSel.attr('r', d => nodeRadius(d));
    simulation.force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 4).strength(0.7));
    simulation.alpha(0.3).restart();
});

// Search highlight: if text matches single node, select it
document.getElementById('searchBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const search = this.value.toLowerCase().trim();
        if (!search) return;
        const match = allNodes.find(n => n.name.toLowerCase().includes(search));
        if (match) {
            selectNode(match);
            // Pan to node
            const transform = d3.zoomTransform(svg.node());
            const x = width / 2 - match.x * transform.k;
            const y = height / 2 - match.y * transform.k;
            svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(x, y).scale(transform.k));
        }
    }
});

// Resize
window.addEventListener('resize', () => {
    if (container.clientWidth === width && container.clientHeight === height) return;
    width = container.clientWidth; height = container.clientHeight;
    svg.attr('width', width).attr('height', height);
    simulation.force('center', d3.forceCenter(width / 2, height / 2));
    simulation.force('x', d3.forceX(width / 2).strength(0.03));
    simulation.force('y', d3.forceY(height / 2).strength(0.03));
    simulation.alpha(0.3).restart();
});

// ── Mobile layout ──
(function () {
    const mq = window.matchMedia('(max-width: 768px)');
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('filterToggle');
    const panel = document.getElementById('detailPanel');
    const help = sidebar.querySelector('.net-help');
    const layout = document.querySelector('.net-layout');

    toggle.addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
        toggle.textContent = open ? 'Hide filters' : 'Show filters';
    });

    // On phones the selected-node details sit under the graph, where you're looking
    function placePanel() {
        if (mq.matches) layout.appendChild(panel);
        else sidebar.insertBefore(panel, help);
    }
    placePanel();
    mq.addEventListener('change', placePanel);

    const origSelect = selectNode;
    selectNode = function (d) {
        origSelect(d);
        if (mq.matches) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    // Start zoomed out so the whole network fits a small screen
    if (mq.matches) {
        const k = 0.4;
        svg.call(zoomBehavior.transform,
            d3.zoomIdentity.translate(width / 2 * (1 - k), height / 2 * (1 - k)).scale(k));
    }
})();
</script>

</body>
</html>
