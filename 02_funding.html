<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.header {

    padding: 24px 40px;

.header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c084fc);

    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;

.nav { display: flex; gap: 8px; }
.nav a {
    color: #94a3b8;

}
.container { padding: 32px 40px; max-width: 1600px; margin: 0 auto; }
.grid { display: grid; gap: 24px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.card {
    background: linear-gradient(135deg, #111827 0%, #0f172a 100%);

.card:hover { border-color: rgba(99, 102, 241, 0.4); }
.card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #64748b;
    margin-bottom: 16px;
    font-weight: 600;
}
.metric-value {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

.metric-label { font-size: 13px; color: #64748b; margin-top: 4px; }
.chart-container { width: 100%; height: 420px; }
.chart-lg { height: 520px; }
.chart-xl { height: 620px; }
.subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 24px;
}
.badge {

    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;

th, td { padding: 10px 14px; text-align: left; font-size: 13px; }
th { color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; font-size: 11px; border-bottom: 1px solid rgba(99, 102, 241, 0.2); }
td { border-bottom: 1px solid rgba(99, 102, 241, 0.08); color: #c9d1d9; }
tr:hover td { background: rgba(99, 102, 241, 0.05); }

@media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .container { padding: 16px; } }

.nav a, .badge { white-space: nowrap; }

    .header { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px 20px; }

@media (max-width: 768px) {

    .nav { margin: 0 -16px; padding: 0 16px 2px; }

    .container > [style*="margin-bottom"] { margin-bottom: 12px !important; }

    .card h3 { font-size: 11px; margin-bottom: 10px; }
    .metric-value { font-size: 26px; }
    .metric-label { font-size: 12px; }
    .subtitle { font-size: 13px; margin-bottom: 16px; }
    .chart-container { height: 340px; }

<script>
/* Mobile tweaks: every ECharts chart adapts its layout on narrow screens */
(function () {
    var BREAK = 640;
    function narrow() { return window.innerWidth < BREAK; }
    function arr(v) { return v == null ? [] : (Array.isArray(v) ? v : [v]); }

    // ECharts resets position keys that are missing from a merge, so carry them over
    function pos(o) {
        var out = {};
        ['left', 'right', 'top', 'bottom', 'orient'].forEach(function (k) { if (o && o[k] != null) out[k] = o[k]; });
        return out;
    }

    function mobilePatch(opt) {
        var p = {};
        var series = arr(opt.series);
        var hasHeatmap = series.some(function (s) { return s.type === 'heatmap'; });
        var legendBottom = opt.legend && opt.legend.show !== false && opt.legend.bottom != null;
        var xHasName = arr(opt.xAxis).some(function (a) { return a.name; });

        if (opt.tooltip) p.tooltip = { confine: true, textStyle: { fontSize: 11 } };

        if (opt.grid) {
            var bottom = hasHeatmap ? 60 : (legendBottom ? 44 : 8);
            if (xHasName) bottom += 26;
            p.grid = Object.assign(pos(opt.grid), { left: 4, right: 14, containLabel: true, bottom: bottom });
        }

        ['xAxis', 'yAxis'].forEach(function (k) {
            if (!opt[k]) return;
            p[k] = arr(opt[k]).map(function (ax) {
                var o = { axisLabel: { fontSize: hasHeatmap ? 9 : 10, hideOverlap: !hasHeatmap } };
                if (ax.type === 'category') {
                    var labels = arr(ax.data).map(String);
                    var longest = Math.max.apply(null, labels.map(function (s) { return s.length; }).concat(0));
                    if (k === 'yAxis') {
                        o.axisLabel.width = hasHeatmap ? 70 : 96;
                        o.axisLabel.overflow = 'truncate';
                    } else if (longest > 4 && labels.length > 4) {
                        o.axisLabel.rotate = hasHeatmap ? 90 : 40;
                        o.axisLabel.width = 70;
                        o.axisLabel.overflow = 'truncate';
                    }
                    if (hasHeatmap) o.axisLabel.interval = 0;
                }
                if (ax.name) {
                    if (k === 'yAxis') o.nameTextStyle = { align: 'left', fontSize: 10 };
                    else { o.nameLocation = 'middle'; o.nameGap = 26; }
                }
                return o;
            });
        });

        // Let the legend wrap onto extra lines and make room for them
        var legendRows = 0;
        if (legendBottom) {
            var names = series.some(function (x) { return x.type === 'pie'; })
                ? arr(series[0].data).map(function (d) { return d.name; })
                : series.map(function (x) { return x.name; });
            var avail = Math.min(window.innerWidth, BREAK) - 64, line = 0;
            legendRows = 1;
            names.forEach(function (n) {
                var w = String(n).length * 6 + 26;
                if (line + w > avail && line > 0) { legendRows++; line = 0; }
                line += w;
            });
            p.legend = Object.assign(pos(opt.legend), { itemWidth: 12, itemHeight: 8, itemGap: 8,
                textStyle: Object.assign({}, opt.legend.textStyle, { fontSize: 10 }) });
            if (p.grid) p.grid.bottom = 12 + legendRows * 16 + (xHasName ? 26 : 0);
        }

        var groupedBars = series.filter(function (s) { return s.type === 'bar' && !s.stack; }).length;
        p.series = series.map(function (s) {
            var o = {};
            if (s.type === 'bar' && typeof s.barWidth === 'number') {
                o.barWidth = (s.stack || groupedBars < 2) ? '60%' : Math.floor(70 / groupedBars) + '%';
                o.barMaxWidth = s.barWidth;
            }
            if (s.type === 'pie' && !(s.label && s.label.show === false)) {
                o.label = { fontSize: 10 };
                o.labelLine = { length: 6, length2: 6 };
                o.radius = s.roseType ? ['20%', '58%'] : ['34%', '56%'];
            }
            if (s.type === 'pie' && legendRows > 1) {
                o.center = ['50%', (46 - legendRows * 4) + '%'];
                if (s.label && s.label.show === false) o.radius = ['30%', '56%'];
            }
            if (s.type === 'treemap') { o.label = { fontSize: 10 }; o.left = 0; o.right = 0; o.top = 0; o.bottom = 0; o.width = '100%'; o.height = '100%'; }
            if (s.type === 'sankey') { o.label = { fontSize: 9 }; o.nodeGap = 8; o.nodeWidth = 12; o.left = 4; o.right = 112; }
            if (s.type === 'heatmap') o.label = { show: false };
            return o;
        });

        if (opt.visualMap) p.visualMap = Object.assign(pos(opt.visualMap), { itemHeight: 120, itemWidth: 12 });
        return p;
    }

    var origInit = echarts.init;
    var entries = [];
    echarts.init = function () {
        var chart = origInit.apply(echarts, arguments);
        var baseSet = chart.setOption.bind(chart);
        var entry = { base: null, set: baseSet };
        chart.setOption = function (opt, a, b) {
            entry.base = opt;
            baseSet(opt, a, b);
            if (narrow()) baseSet(mobilePatch(opt));
        };
        entries.push(entry);
        return chart;
    };

    var wasNarrow = narrow();
    window.addEventListener('resize', function () {
        var now = narrow();
        if (now === wasNarrow) return;
        wasNarrow = now;
        entries.forEach(function (e) {
            if (!e.base) return;
            e.set(e.base, true);
            if (now) e.set(mobilePatch(e.base));
        });
    });
})();
</script>

    const stages = boxData.map(d => d.stage);
    // Use custom rendering: candlestick-style
    chart.setOption({
        tooltip: { trigger: 'axis', formatter: function(p) {
            const d = boxData[p[0].dataIndex];
            return d.stage + '<br>Min: $' + d.min + 'M<br>Q1: $' + d.q1 + 'M<br>Median: $' + d.median + 'M<br>Q3: $' + d.q3 + 'M<br>Max: $' + d.max + 'M';
        } },
        grid: { left: 70, right: 40, top: 45, bottom: 40 },
        xAxis: { type: 'category', data: stages, axisLabel: { color: '#c9d1d9', fontSize: 12 }, axisLine: { lineStyle: { color: 'rgba(99,102,241,0.2)' } } },
        yAxis: { type: 'value', name: 'Valuation ($M)', nameTextStyle: { color: '#94a3b8', padding: [0, 0, 10, 0] }, axisLabel: { color: '#64748b' }, splitLine: { lineStyle: { color: 'rgba(99,102,241,0.1)' } } },
        series: [
            { name: 'Range', type: 'custom', renderItem: function(params, api) {
                const idx = params.dataIndex;
                const d = boxData[idx];
                const x = api.coord([idx, 0])[0];
                const q1Y = api.coord([0, d.q1])[1];
                const q3Y = api.coord([0, d.q3])[1];
                const medY = api.coord([0, d.median])[1];
                const minY = api.coord([0, d.min])[1];

                const w = 30;
                return {
                    type: 'group',
                    children: [
                        { type: 'line', shape: { x1: x, y1: minY, x2: x, y2: maxY }, style: { stroke: '#818cf8', lineWidth: 1 } },
                        { type: 'rect', shape: { x: x-w/2, y: q3Y, width: w, height: q1Y-q3Y }, style: { fill: 'rgba(129,140,248,0.3)', stroke: '#818cf8', lineWidth: 2 } },
                        { type: 'line', shape: { x1: x-w/2, y1: medY, x2: x+w/2, y2: medY }, style: { stroke: '#c084fc', lineWidth: 3 } },
                        { type: 'line', shape: { x1: x-10, y1: minY, x2: x+10, y2: minY }, style: { stroke: '#818cf8', lineWidth: 1 } },
                        { type: 'line', shape: { x1: x-10, y1: maxY, x2: x+10, y2: maxY }, style: { stroke: '#818cf8', lineWidth: 1 } },
                    ]
                };
            }, data: boxData.map((d,i) => [i, d.q1, d.q3, d.min, d.max]),
            encode: { x: 0, y: [1,2,3,4] } }
        ]
    });
    window.addEventListener('resize', () => chart.resize());
})();
</script>

</body>
